<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeni Quick Builder</title>
<style>
  :root{ --primary:#0f766e; --btn-text:#fff; --ink:#111827; --line:#d1d5db; --muted:#6b7280; --soft:#f3f4f6; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:transparent; }
  .qb{ max-width:1040px; margin:0 auto; padding:14px; }
  .qb-card{ background:#fff; border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.06); }  /* no overflow:hidden — it clips the autocomplete dropdown */
  /* tabs */
  .qb-tabs{ display:flex; gap:2px; background:var(--soft); padding:6px 6px 0; overflow-x:auto; border-radius:13px 13px 0 0; }
  .qb-tab{ appearance:none; border:none; background:transparent; padding:11px 15px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; border-radius:10px 10px 0 0; white-space:nowrap; display:inline-flex; align-items:center; gap:7px; transition:color .15s, background .15s; }
  .qb-tab:hover{ color:var(--ink); }
  .qb-tab.active{ background:#fff; color:var(--primary); box-shadow:0 -2px 0 var(--primary) inset; }
  .qb-tab svg{ width:16px; height:16px; }
  .qb-body{ padding:18px; }
  .qb-title{ font-size:17px; font-weight:700; margin:0 0 14px; }
  /* form grid */
  .qb-row{ display:grid; gap:10px; align-items:end; }
  .qb-row.hotels{ grid-template-columns:2fr 1fr 1fr 1.1fr auto; }
  .qb-row.flights{ grid-template-columns:1.4fr 1.4fr 1fr 1fr .9fr auto; }
  @media (max-width:860px){ .qb-row{ grid-template-columns:1fr 1fr !important; } .qb-search-cell{ grid-column:1 / -1; } }
  .fld{ position:relative; display:flex; flex-direction:column; min-width:0; }
  .fld label{ font-size:12px; font-weight:600; color:var(--muted); margin:0 0 5px; }
  .fld input, .fld select{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; color:var(--ink); background:#fff; }
  .fld input:focus,.fld select:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .qb-btn{ width:100%; padding:12px 20px; border:none; border-radius:9px; background:var(--primary); color:var(--btn-text); font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap; transition:filter .15s, transform .05s; }
  .qb-btn:hover{ filter:brightness(1.06); }
  .qb-btn:active{ transform:translateY(1px); }
  .trip{ display:flex; gap:14px; margin:0 2px 10px; font-size:13px; color:var(--ink); }
  .trip label{ display:flex; align-items:center; gap:5px; cursor:pointer; font-weight:600; }
  /* autocomplete */
  .ac{ position:absolute; top:100%; left:0; right:0; z-index:50; background:#fff; border:1px solid var(--line); border-radius:10px; margin-top:4px; box-shadow:0 10px 30px rgba(0,0,0,.12); max-height:260px; overflow-y:auto; display:none; }
  .ac.open{ display:block; }
  .ac-item{ padding:9px 12px; cursor:pointer; font-size:14px; display:flex; gap:9px; align-items:center; }
  .ac-item:hover,.ac-item.active{ background:var(--soft); }
  .ac-pin{ color:var(--primary); flex:0 0 auto; font-size:11px; }
  .ac-main{ font-weight:600; }
  .ac-sub{ color:var(--muted); font-size:12px; }
  .ac-empty{ padding:10px 12px; color:var(--muted); font-size:13px; }
  .soon{ padding:26px 12px; text-align:center; color:var(--muted); font-size:14px; }
  .qb-foot{ font-size:11px; color:var(--muted); text-align:center; padding:0 12px 12px; }
  .qb-foot a{ color:var(--muted); }
  .fld input{ transition:border-color .15s, box-shadow .15s; }
  .fld input:hover{ border-color:#9ca3af; }
  .ac-loading{ padding:12px; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; }
  .ac-spin{ width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:qbspin .7s linear infinite; }
  @keyframes qbspin{ to{ transform:rotate(360deg); } }
  /* seamless: drop the card chrome so the widget blends into the host page */
  body.seamless .qb-card{ background:transparent; border:none; box-shadow:none; }
  body.seamless .qb-tabs{ background:transparent; padding-left:0; }
  body.seamless .qb-tab.active{ background:rgba(255,255,255,.55); }
</style>
</head>
<body>
<div class="qb">
  <div class="qb-card">
    <div class="qb-tabs" id="qb-tabs"></div>
    <div class="qb-body" id="qb-body"></div>
    <div class="qb-foot" id="qb-foot"></div>
  </div>
</div>

<script>
/* ================= CONFIG (all public; no keys) ================= */
var P = new URLSearchParams(location.search);
var QB = {
  platformUrl: P.get('platform') || 'https://lifestylevacation.uat.booking.clubxeni.com', // TEST default
  primary:     P.get('primary')  || '',
  poweredShow: P.get('powered') !== '0',                 // ?powered=0 hides it
  poweredText: P.get('poweredText') || 'Powered by Xeni',
  bg:          P.get('bg')    || 'card',                 // card | seamless
  startTab:    P.get('tab') || ''               // empty = first visible tab
};
// brand color + auto-contrast button text (dark text on light brand colors)
function relLum(hex){ hex=hex.replace('#',''); if(hex.length!==6) return 0;
  var c=[0,2,4].map(function(i){ var v=parseInt(hex.substr(i,2),16)/255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
if(QB.primary){
  var hex = QB.primary[0]==='#'?QB.primary:'#'+QB.primary;
  document.documentElement.style.setProperty('--primary', hex);
  document.documentElement.style.setProperty('--btn-text', relLum(hex) > 0.55 ? '#111827' : '#ffffff');
}
if(QB.bg==='seamless') document.body.classList.add('seamless');

// tab icons (inline SVG, currentColor)
var ICONS = {
  hotels:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M10 21v-4h4v4"/></svg>',
  flights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7l5.1 3.2-2 3.5-2.6-.4a1 1 0 0 0-.9 1.6L6 22l1.7-1.8 2.6 1.7a1 1 0 0 0 1.6-.9l-.4-2.6 3.5-2 3.2 5.1a1 1 0 0 0 1.7-.9z"/></svg>',
  resorts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8M2 22h20M4 11a6 6 0 0 1 8-3M20 11a6 6 0 0 0-8-3M12 8a4 4 0 0 0-4-4M12 8a4 4 0 0 1 4-4"/></svg>',
  cars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h14l2 5v5h-2M5 17a2 2 0 1 0 4 0M5 17h10M15 17a2 2 0 1 0 4 0M5 12h14"/></svg>',
  activities:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M10 22l2-6 2 2v4M6 12l3-2 3 2 3-1"/></svg>'
};

/* ================= PRODUCTS ================= */
var ALL_TABS = [
  {key:'hotels',     label:'Hotels',     ready:true},
  {key:'flights',    label:'Flights',    ready:true},
  {key:'resorts',    label:'Resorts',    ready:true},
  {key:'cars',       label:'Cars',       ready:true},
  {key:'activities', label:'Activities', ready:true}
];
// ?tabs=cars,hotels — which products show, in strip order; unknown keys ignored, empty/invalid falls back to all
var TABS = (P.get('tabs')||'').toLowerCase().split(',').map(function(s){return s.trim();})
  .filter(function(k,i,a){return a.indexOf(k)===i;})
  .map(function(k){return ALL_TABS.filter(function(t){return t.key===k;})[0];})
  .filter(function(t){return !!t;});
if(!TABS.length) TABS = ALL_TABS;
// autocomplete config per product
var AC = {
  hotels: {
    file:'data/hotels.json',
    starts:function(d){return [d.name];},
    hay:function(d){return (d.name+' '+d.full_name).toLowerCase();},
    main:function(d){return d.name;}, sub:function(d){return d.full_name;},
    pick:function(d){return d.full_name;},
    rank:function(d){return d.rank==null?1:d.rank;}
  },
  flights: {
    file:'data/flights.json',
    starts:function(d){return [d.code, d.city];},
    hay:function(d){return (d.code+' '+d.city+' '+d.name).toLowerCase();},
    main:function(d){return d.code+' · '+d.city;}, sub:function(d){return d.name+', '+d.country;},
    pick:function(d){return d.code+' - '+d.city;},
    rank:function(d){return d.rank==null?999:d.rank;}
  },
  resorts: {
    file:'data/resorts.json',
    starts:function(d){return [d.name];},
    hay:function(d){return (d.name+' '+d.full_name).toLowerCase();},
    main:function(d){return d.name;}, sub:function(d){return d.full_name;},
    pick:function(d){return d.full_name;},
    rank:function(d){return 1;}
  },
  cars: {
    file:'data/cars.json',
    starts:function(d){return [d.name, d.city_name, d.iata_code];},
    hay:function(d){return (d.name+' '+d.city_name+' '+d.iata_code).toLowerCase();},
    main:function(d){return d.name;}, sub:function(d){return (d.city_name||d.state||'')+(d.country_name?', '+d.country_name:'');},
    pick:function(d){return d.name;},
    rank:function(d){return d.type==='airport'?0:1;}  // car rentals: airports first
  },
  activities: {
    file:'data/activities.json',
    starts:function(d){return [d.name];},
    hay:function(d){return (d.name+' '+d.full_name).toLowerCase();},
    main:function(d){return d.name;}, sub:function(d){return d.full_name;},
    pick:function(d){return d.full_name;},
    rank:function(d){return 1;}
  }
};

/* ================= helpers ================= */
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
function isoDate(offsetDays){ return new Date(Date.now()+offsetDays*864e5).toISOString().slice(0,10); }
function prom(s){ s=s||''; return s.split(',').length*100 + s.length; }
function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function go(url){ var w=window.open(url,'_blank'); if(!w){ try{window.top.location.href=url;}catch(e){window.location.href=url;} } }

var DATA={}; // cache: product -> array
function loadData(key){
  if(DATA[key]) return Promise.resolve(DATA[key]);
  return fetch(AC[key].file).then(function(r){return r.json();}).then(function(j){ DATA[key]=j; return j; })
    .catch(function(){ DATA[key]=[]; return []; });
}

/* generic autocomplete: input + box, product cfg, stores picked object on input._sel */
function wireAutocomplete(input, box, key){
  var cfg=AC[key], matches=[], activeIdx=-1;
  function search(q){
    q=(q||'').toLowerCase().trim(); if(q.length<2) return [];
    var list=DATA[key]||[], starts=[], contains=[];
    for(var i=0;i<list.length;i++){ var d=list[i];
      var s=cfg.starts(d).some(function(t){return (t||'').toLowerCase().indexOf(q)===0;});
      if(s) starts.push(d); else if(cfg.hay(d).indexOf(q)>-1) contains.push(d);
    }
    var k=function(d){return cfg.rank(d)*1e6 + prom(cfg.sub(d));};
    starts.sort(function(a,b){return k(a)-k(b);}); contains.sort(function(a,b){return k(a)-k(b);});
    return starts.concat(contains).slice(0,8);
  }
  function render(){
    if(!matches.length){ box.innerHTML='<div class="ac-empty">No match — type a place and search anyway.</div>'; box.classList.add('open'); return; }
    box.innerHTML=matches.map(function(d,i){
      return '<div class="ac-item'+(i===activeIdx?' active':'')+'" data-i="'+i+'"><span class="ac-pin">●</span>'
        +'<span><span class="ac-main">'+cfg.main(d)+'</span><br><span class="ac-sub">'+cfg.sub(d)+'</span></span></div>';
    }).join(''); box.classList.add('open');
  }
  input.addEventListener('input', function(){
    input._sel=null; activeIdx=-1;
    if(input.value.trim().length<2){ box.classList.remove('open'); return; }
    if(!DATA[key]){ box.innerHTML='<div class="ac-loading"><span class="ac-spin"></span>Loading destinations…</div>'; box.classList.add('open'); }
    loadData(key).then(function(){ matches=search(input.value); render(); });
  });
  box.addEventListener('mousedown', function(e){ var it=e.target.closest('.ac-item'); if(!it) return;
    var d=matches[+it.getAttribute('data-i')]; input._sel=d; input.value=cfg.pick(d); box.classList.remove('open');
  });
  input.addEventListener('keydown', function(e){
    if(!box.classList.contains('open')||!matches.length) return;
    if(e.key==='ArrowDown'){activeIdx=Math.min(activeIdx+1,matches.length-1);render();e.preventDefault();}
    else if(e.key==='ArrowUp'){activeIdx=Math.max(activeIdx-1,0);render();e.preventDefault();}
    else if(e.key==='Enter'&&activeIdx>-1){var d=matches[activeIdx];input._sel=d;input.value=cfg.pick(d);box.classList.remove('open');e.preventDefault();}
    else if(e.key==='Escape'){box.classList.remove('open');}
  });
  document.addEventListener('click', function(e){ if(!box.parentNode.contains(e.target)) box.classList.remove('open'); });
}

/* ================= URL builders ================= */
function hotelsUrl(f){
  var loc=f.dest._sel || {id:"0",name:f.dest.value,full_name:f.dest.value,country:"",type:"City",lat:0,long:0};
  var p=new URLSearchParams();
  p.append('correlationId',uuid());
  if(f.cin.value) p.append('startDate',f.cin.value);
  if(f.cout.value) p.append('endDate',f.cout.value);
  p.append('isOTA','true');
  p.append('location',JSON.stringify({id:String(loc.id||"0"),name:loc.name,country:loc.country||"",full_name:loc.full_name||loc.name,type:loc.type||"City",location:{lat:loc.lat||0,long:loc.long||0}}));
  var rooms=parseInt(f.rooms.value)||1, guests=parseInt(f.guests.value)||2, occ=[];
  for(var i=0;i<rooms;i++) occ.push({id:uuid(),adults:Math.ceil(guests/rooms),childs:0,childages:[]});
  p.append('occupancy',JSON.stringify(occ));
  p.append('preference',JSON.stringify(["All"]));
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/hotels/v2/search?'+p.toString();
}
function airportObj(sel, raw){
  if(sel) return {airport_code:sel.code,airport_name:sel.name,city_name:sel.city,country_code:sel.cc||'',country_name:sel.country||'',display:sel.code+' - '+sel.name+' - '+sel.city+' - '+sel.country,type:'Airport'};
  return {airport_code:'',airport_name:'',city_name:'',country_code:'',country_name:'',display:raw||'',type:'Airport'};
}
function flightsUrl(f){
  var dep=f.dep.value?new Date(f.dep.value+'T00:00:00'):new Date();
  var ret=f.ret.value?new Date(f.ret.value+'T00:00:00'):null;
  var round=f.body.querySelector('input[name=trip]:checked').value==='round';
  var q={
    selectedOrigin:airportObj(f.from._sel,f.from.value),
    selectedDestination:airportObj(f.to._sel,f.to.value),
    rangeDate:{startDate:dep.toISOString(),endDate:(round&&ret?ret:dep).toISOString()},
    route_type:round?'roundTrip':'oneWay',
    cabin_type:'Economy', adults:parseInt(f.pax.value)||1, children:0, infants:0
  };
  var p=new URLSearchParams(); p.append('correlationId',uuid()); p.append('query',JSON.stringify(q));
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/flights/v2/search?'+p.toString();
}
function resortsUrl(f){
  var s=f.dest._sel || {name:f.dest.value,full_name:f.dest.value,state:"",city:"",country:"",region:"",type:"city",lat:0,lon:0};
  var p=new URLSearchParams(); p.append('correlationId',uuid());
  if(f.cin.value) p.append('startDate',f.cin.value);
  if(f.cout.value) p.append('endDate',f.cout.value);
  p.append('location',JSON.stringify({name:s.name,full_name:s.full_name||s.name,state:s.state||"",city:s.city||"",country:s.country||"",region:s.region||"",type:(s.type||"city"),location:{lat:s.lat||0,lon:s.lon||0}}));
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/resort/search?'+p.toString();
}
function twelveHr(t){ if(!t) return '10:00 AM'; var a=t.split(':'),h=parseInt(a[0],10),m=a[1],ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }
function carsUrl(f){
  var s=f.pick._sel || {id:"",name:f.pick.value,city_name:"",country_name:"",iata_code:"",type:"location",coordinates:{},region_id:""};
  var p=new URLSearchParams(); p.append('correlationId',uuid());
  p.append('country','US'); p.append('currency','USD'); p.append('driverAge','25'); p.append('driverCountry','US');
  p.append('dropOffOption','Same as pick-up'); p.append('dropOffLocation',''); p.append('dropOffLocationData','');
  var pu=f.pickup.value.split('T'), dp=f.drop.value.split('T');
  p.append('startDate',pu[0]||''); p.append('endDate',dp[0]||'');
  p.append('pickupTime',twelveHr(pu[1])); p.append('dropoffTime',twelveHr(dp[1]));
  p.append('location',JSON.stringify({id:s.id||"",name:s.name,city_name:s.city_name||"",country_name:s.country_name||"",iata_code:s.iata_code||"",type:s.type||"location",coordinates:s.coordinates||{},region_id:s.region_id||""}));
  p.append('pickupCode',s.iata_code||""); p.append('pickupType',s.type==='airport'?'iata':'geo');
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/cars/v2/search?'+p.toString();
}
function activitiesUrl(f){
  var s=f.dest._sel || {name:f.dest.value,id:"",lat:0,long:0};
  var start=f.date.value, end=start?isoDateFrom(start,1):'';
  var p=new URLSearchParams(); p.append('correlationId',uuid());
  if(start) p.append('startDate',start); if(end) p.append('endDate',end);
  p.append('isOTA','true');
  p.append('location',JSON.stringify({name:s.name,id:s.id||"",location:{lat:s.lat||0,long:s.long||0}}));
  p.append('occupancy',JSON.stringify([{adults:parseInt(f.guests.value)||2,childs:0,childages:[]}]));
  p.append('preference',JSON.stringify([]));
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/activity/v2/search?'+p.toString();
}
function isoDateFrom(d, addDays){ var t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+addDays); return t.toISOString().slice(0,10); }

/* ================= panels ================= */
function hotelsPanel(){
  var wrap=el('<div><div class="qb-title">Book Your Stay</div>'
   +'<div class="qb-row hotels">'
   +'<div class="fld"><label>Destination</label><input id="h-dest" autocomplete="off" placeholder="Where are you going?"><div class="ac" id="h-ac"></div></div>'
   +'<div class="fld"><label>Check-in</label><input id="h-in" type="date"></div>'
   +'<div class="fld"><label>Check-out</label><input id="h-out" type="date"></div>'
   +'<div class="fld"><label>Guests</label><input id="h-guests" type="number" min="1" value="2"></div>'
   +'<div class="fld qb-search-cell"><label>&nbsp;</label><button class="qb-btn" id="h-go">Search Hotels</button></div>'
   +'</div><input type="hidden" id="h-rooms" value="1"></div>');
  qbBody.innerHTML=''; qbBody.appendChild(wrap);
  var dest=wrap.querySelector('#h-dest');
  wireAutocomplete(dest, wrap.querySelector('#h-ac'), 'hotels');
  wrap.querySelector('#h-in').value=isoDate(14); wrap.querySelector('#h-out').value=isoDate(17);
  loadData('hotels');
  wrap.querySelector('#h-go').addEventListener('click',function(){
    if(!dest.value.trim()){dest.focus();return;}
    go(hotelsUrl({dest:dest,cin:wrap.querySelector('#h-in'),cout:wrap.querySelector('#h-out'),guests:wrap.querySelector('#h-guests'),rooms:wrap.querySelector('#h-rooms')}));
  });
}
function flightsPanel(){
  var wrap=el('<div><div class="qb-title">Find Flights</div>'
   +'<div class="trip"><label><input type="radio" name="trip" value="round" checked> Round-trip</label>'
   +'<label><input type="radio" name="trip" value="one"> One-way</label></div>'
   +'<div class="qb-row flights">'
   +'<div class="fld"><label>From</label><input id="f-from" autocomplete="off" placeholder="City or airport"><div class="ac" id="f-fac"></div></div>'
   +'<div class="fld"><label>To</label><input id="f-to" autocomplete="off" placeholder="City or airport"><div class="ac" id="f-tac"></div></div>'
   +'<div class="fld"><label>Departure</label><input id="f-dep" type="date"></div>'
   +'<div class="fld"><label>Return</label><input id="f-ret" type="date"></div>'
   +'<div class="fld"><label>Passengers</label><input id="f-pax" type="number" min="1" value="1"></div>'
   +'<div class="fld qb-search-cell"><label>&nbsp;</label><button class="qb-btn" id="f-go">Search Flights</button></div>'
   +'</div></div>');
  qbBody.innerHTML=''; qbBody.appendChild(wrap);
  var from=wrap.querySelector('#f-from'), to=wrap.querySelector('#f-to'), ret=wrap.querySelector('#f-ret');
  wireAutocomplete(from, wrap.querySelector('#f-fac'), 'flights');
  wireAutocomplete(to, wrap.querySelector('#f-tac'), 'flights');
  wrap.querySelector('#f-dep').value=isoDate(14); ret.value=isoDate(21);
  loadData('flights');
  // toggle return enabled by trip type
  wrap.querySelectorAll('input[name=trip]').forEach(function(r){ r.addEventListener('change',function(){
    var one=wrap.querySelector('input[name=trip]:checked').value==='one'; ret.disabled=one; ret.style.opacity=one?.45:1;
  });});
  wrap.querySelector('#f-go').addEventListener('click',function(){
    if(!from.value.trim()||!to.value.trim()){(from.value.trim()?to:from).focus();return;}
    go(flightsUrl({from:from,to:to,dep:wrap.querySelector('#f-dep'),ret:ret,pax:wrap.querySelector('#f-pax'),body:wrap}));
  });
}

function soonPanel(label){ qbBody.innerHTML='<div class="soon"><strong>'+label+'</strong> coming soon.</div>'; }

/* ================= tabs / boot ================= */
var qbTabs=document.getElementById('qb-tabs'), qbBody=document.getElementById('qb-body');
function selectTab(key){
  [].forEach.call(qbTabs.children,function(b){ b.classList.toggle('active', b.dataset.k===key); });
  if(key==='hotels') hotelsPanel();
  else if(key==='flights') flightsPanel();
  else if(key==='resorts') resortsPanel();
  else if(key==='cars') carsPanel();
  else if(key==='activities') activitiesPanel();
  else soonPanel((TABS.filter(function(t){return t.key===key;})[0]||{}).label||key);
}
TABS.forEach(function(t){
  var b=el('<button class="qb-tab" data-k="'+t.key+'">'+(ICONS[t.key]||'')+'<span>'+t.label+'</span></button>');
  b.addEventListener('click',function(){selectTab(t.key);}); qbTabs.appendChild(b);
});
// powered-by
(function(){
  var f=document.getElementById('qb-foot');
  if(QB.poweredShow && QB.poweredText){ f.textContent=QB.poweredText; } else { f.style.display='none'; }
})();
selectTab(TABS.some(function(t){return t.key===QB.startTab;})?QB.startTab:TABS[0].key);
</script>
