<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeni Quick Builder</title>
<style>
  :root{ --primary:#004e7a; --btn-text:#fff; --ink:#111827; --line:#d1d5db; --muted:#6b7280; --soft:#f3f4f6; --card:#ffffff; --strip:#f3f4f6; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:transparent; }
  .qb{ max-width:1040px; margin:0 auto; padding:14px; }
  .qb-card{ background:var(--card); border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.06); }  /* no overflow:hidden — it clips the autocomplete dropdown */
  /* tabs */
  .qb-tabs{ display:flex; gap:2px; background:var(--strip); padding:6px 6px 0; overflow-x:auto; border-radius:13px 13px 0 0; }
  .qb-tab{ appearance:none; border:none; background:transparent; padding:11px 15px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; border-radius:10px 10px 0 0; white-space:nowrap; display:inline-flex; align-items:center; gap:7px; transition:color .15s, background .15s; }
  .qb-tab:hover{ color:var(--ink); }
  .qb-tab.active{ background:var(--card); color:var(--primary); box-shadow:0 -2px 0 var(--primary) inset; }
  .qb-tab svg{ width:16px; height:16px; }
  .qb-body{ padding:18px; }
  .qb-title{ font-size:17px; font-weight:700; margin:0 0 14px; }
  /* form grid */
  .qb-row{ display:grid; gap:10px; align-items:end; }
  .qb-row.hotels{ grid-template-columns:2fr 1fr 1fr 1.1fr auto; }
  .qb-row.flights{ grid-template-columns:1.4fr 1.4fr 1fr 1fr .9fr auto; }
  .qb-row.resorts{ grid-template-columns:2fr 1fr 1fr auto; }
  .qb-row.cars{ grid-template-columns:1.5fr 1.5fr 1.1fr 1.1fr auto; }
  @media (max-width:860px){ .qb-row{ grid-template-columns:1fr 1fr !important; } .qb-search-cell{ grid-column:1 / -1; } }
  .fld{ position:relative; display:flex; flex-direction:column; min-width:0; }
  .fld label{ font-size:12px; font-weight:600; color:var(--muted); margin:0 0 5px; }
  .fld input, .fld select{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; color:var(--ink); background:#fff; }
  .fld input:focus,.fld select:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .qb-btn{ width:100%; padding:12px 20px; border:none; border-radius:9px; background:var(--primary); color:var(--btn-text); font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap; transition:filter .15s, transform .05s; }
  .qb-btn:hover{ filter:brightness(1.06); }
  .qb-btn:active{ transform:translateY(1px); }
  .trip{ display:flex; gap:14px; margin:0 2px 10px; font-size:13px; color:var(--ink); flex-wrap:wrap; align-items:center; }
  .trip label{ display:flex; align-items:center; gap:5px; cursor:pointer; font-weight:600; }
  .trip .sel-wrap{ display:flex; align-items:center; gap:6px; font-weight:600; }
  .trip select{ padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:13px; color:var(--ink); background:#fff; max-width:200px; }
  .trip input[type=number]{ width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:13px; color:var(--ink); }
  /* traveler/rooms popover (same iframe-fit rules as the autocomplete dropdown) */
  .fld input[readonly]{ cursor:pointer; background:#fff; }
  .pop{ position:absolute; top:100%; left:0; z-index:60; background:#fff; border:1px solid var(--line); border-radius:10px; margin-top:4px; box-shadow:0 10px 30px rgba(0,0,0,.12); display:none; padding:12px; min-width:252px; overflow-y:auto; }
  .pop.open{ display:block; }
  .pop.up{ top:auto; bottom:100%; margin-top:0; margin-bottom:4px; box-shadow:0 -10px 30px rgba(0,0,0,.12); }
  .pop-room{ border-bottom:1px solid var(--soft); padding:2px 0 8px; margin-bottom:8px; }
  .pop-head{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px; margin:2px 0 4px; }
  .pop-x{ border:none; background:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px; }
  .pop-x:hover{ color:var(--ink); }
  .pop-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:7px 0; font-size:13px; font-weight:600; }
  .pop-row .hint{ display:block; font-size:11px; color:var(--muted); font-weight:400; }
  .step{ display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:0 0 auto; }
  .step button{ width:28px; height:28px; border:none; background:#fff; color:var(--primary); font-size:16px; cursor:pointer; line-height:1; }
  .step button:disabled{ color:#c7ccd4; cursor:default; }
  .step span{ min-width:26px; text-align:center; font-weight:600; font-size:13px; }
  .age-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0; font-size:12px; color:var(--muted); }
  .age-row input{ width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-size:13px; color:var(--ink); }
  .pop-opt{ display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:13px; cursor:pointer; border-radius:6px; }
  .pop-opt:hover{ background:var(--soft); }
  .pop-opt input{ accent-color:var(--primary); margin:0; width:auto; flex:0 0 auto; padding:0; }  /* .fld input{width:100%} must not stretch the checkboxes (Firefox honors it) */
  .pop-opt span{ flex:1 1 auto; text-align:left; }
  .pop-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; gap:10px; }
  .pop-add{ border:none; background:none; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; padding:6px 0; }
  .pop-done{ border:none; background:var(--primary); color:var(--btn-text); font-weight:700; font-size:13px; border-radius:8px; padding:8px 16px; cursor:pointer; }
  /* autocomplete */
  .ac{ position:absolute; top:100%; left:0; right:0; z-index:50; background:#fff; border:1px solid var(--line); border-radius:10px; margin-top:4px; box-shadow:0 10px 30px rgba(0,0,0,.12); max-height:260px; overflow-y:auto; display:none; }
  .ac.open{ display:block; }
  .ac.up{ top:auto; bottom:100%; margin-top:0; margin-bottom:4px; box-shadow:0 -10px 30px rgba(0,0,0,.12); }
  .ac-item{ padding:9px 12px; cursor:pointer; font-size:14px; display:flex; gap:9px; align-items:center; }
  .ac-item:hover,.ac-item.active{ background:var(--soft); }
  .ac-pin{ color:var(--primary); flex:0 0 auto; font-size:11px; }
  .ac-main{ font-weight:600; }
  .ac-sub{ color:var(--muted); font-size:12px; }
  .ac-empty{ padding:10px 12px; color:var(--muted); font-size:13px; }
  .soon{ padding:26px 12px; text-align:center; color:var(--muted); font-size:14px; }
  .qb-foot{ font-size:11px; color:var(--muted); text-align:center; padding:0 12px 12px; }
  .qb-foot a{ color:var(--muted); }
  .fld input{ transition:border-color .15s, box-shadow .15s; }
  .fld input:hover{ border-color:#9ca3af; }
  .ac-loading{ padding:12px; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; }
  .ac-spin{ width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:qbspin .7s linear infinite; }
  @keyframes qbspin{ to{ transform:rotate(360deg); } }
  /* redirect veil: soft feedback while the results tab opens */
  .qb-veil{ position:fixed; inset:0; background:rgba(255,255,255,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; opacity:0; pointer-events:none; transition:opacity .3s; z-index:99; text-align:center; padding:20px; }
  .qb-veil.show{ opacity:1; pointer-events:auto; }
  .qb-veil .qb-veil-spin{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:qbspin .8s linear infinite; }
  .qb-veil-msg{ font-size:15px; font-weight:600; color:var(--ink); max-width:420px; }
  /* dark card background: flip on-card text to light; white surfaces (inputs, dropdowns, popovers, veil) keep dark text */
  body.darkcard{ color:#f9fafb; }
  body.darkcard .fld label{ color:#cbd5e1; }
  body.darkcard .trip{ color:#f9fafb; }
  body.darkcard .qb-tab{ color:#b6c2cf; }
  body.darkcard .qb-tab:hover{ color:#fff; }
  body.darkcard .qb-tab.active{ color:#fff; }
  body.darkcard .qb-foot, body.darkcard .qb-foot a{ color:#9aa4b2; }
  body.darkcard .soon{ color:#cbd5e1; }
  body.darkcard .ac, body.darkcard .pop, body.darkcard .qb-veil{ color:var(--ink); }
  /* seamless: drop the card chrome so the widget blends into the host page */
  body.seamless .qb-card{ background:transparent; border:none; box-shadow:none; }
  body.seamless .qb-tabs{ background:transparent; padding-left:0; }
  body.seamless .qb-tab.active{ background:rgba(255,255,255,.55); }
</style>
</head>

  startTab:    P.get('tab') || '',              // empty = first visible tab
  cardBg:      P.get('cardBg') || '',           // widget box color; dark values auto-flip on-card text to light

};
// brand color + auto-contrast button text (dark text on light brand colors)
function relLum(hex){ hex=hex.replace('#',''); if(hex.length!==6) return 0;
  var c=[0,2,4].map(function(i){ var v=parseInt(hex.substr(i,2),16)/255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
if(QB.primary){
  var hex = QB.primary[0]==='#'?QB.primary:'#'+QB.primary;
  document.documentElement.style.setProperty('--primary', hex);
  document.documentElement.style.setProperty('--btn-text', relLum(hex) > 0.55 ? '#111827' : '#ffffff');
}
if(QB.bg==='seamless') document.body.classList.add('seamless');
// custom card background (ignored in seamless mode — the card is transparent there)
function shade(hex,f){ var h=hex.replace('#',''),out='#';
  for(var i=0;i<3;i++){ var v=parseInt(h.substr(i*2,2),16); v=Math.round(f>0 ? v+(255-v)*f : v*(1+f)); out+=('0'+v.toString(16)).slice(-2); }
  return out;
}
if(QB.cardBg && QB.bg!=='seamless'){
  var cbg = QB.cardBg[0]==='#' ? QB.cardBg : '#'+QB.cardBg;
  if(/^#[0-9a-fA-F]{6}$/.test(cbg)){
    document.documentElement.style.setProperty('--card', cbg);
    document.documentElement.style.setProperty('--strip', shade(cbg, relLum(cbg)>0.5 ? -0.07 : 0.14));
    if(relLum(cbg) < 0.5) document.body.classList.add('darkcard');
  }
}

/* local-date formatting on purpose: toISOString() is UTC and shifts the day for visitors in UTC+ timezones */
function fmtDate(t){ return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2); }
function isoDate(offsetDays){ var t=new Date(); t.setDate(t.getDate()+offsetDays); return fmtDate(t); }
function prom(s){ s=s||''; return s.split(',').length*100 + s.length; }

var DATA={}; // cache: product -> array (bundled datasets; the offline fallback when live mode is on)
function loadData(key){
  if(DATA[key]) return Promise.resolve(DATA[key]);
  return fetch(AC[key].file).then(function(r){return r.json();}).then(function(j){ DATA[key]=j; return j; })
    .catch(function(){ DATA[key]=[]; return []; });
}
// panels call warm() on open: in live mode skip the eager download, the bundle only loads if the proxy fails
function warm(key){ if(!QB.api) loadData(key); }
// live suggestions from the proxy; resolves null on any failure so the caller falls back to bundled data
var LIVE={}; // cache: product:query -> entries
function liveSearch(key, q){
  var ck=key+':'+q.toLowerCase();
  if(LIVE[ck]) return Promise.resolve(LIVE[ck]);
  var ctrl=('AbortController' in window)?new AbortController():null;
  var t=ctrl?setTimeout(function(){ctrl.abort();},4000):null;
  return fetch(QB.api+'/ac/'+key+'?q='+encodeURIComponent(q), ctrl?{signal:ctrl.signal}:{})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(list){ if(t)clearTimeout(t); if(!(list instanceof Array)) throw 0; LIVE[ck]=list; return list; })
    .catch(function(){ if(t)clearTimeout(t); return null; });
}

/* generic autocomplete: input + box, product cfg, stores picked object on input._sel */
function wireAutocomplete(input, box, key){
  var cfg=AC[key], matches=[], activeIdx=-1;
  // size/flip the dropdown to the room actually available inside the (possibly short) embed iframe
  function fitBox(){
    var r=input.getBoundingClientRect(), fr=box.parentNode.getBoundingClientRect();
    var below=window.innerHeight-r.bottom-12, above=fr.top-12;  // .ac.up hangs above the whole .fld (label included)
    if(below<140 && above>below){ box.classList.add('up'); box.style.maxHeight=Math.min(260, above-4)+'px'; }
    else { box.classList.remove('up'); box.style.maxHeight=Math.min(260, Math.max(90, below-8))+'px'; }
  }
  function search(q){
    q=(q||'').toLowerCase().trim(); if(q.length<2) return [];
    var list=DATA[key]||[], starts=[], contains=[];
    for(var i=0;i<list.length;i++){ var d=list[i];
      var s=cfg.starts(d).some(function(t){return (t||'').toLowerCase().indexOf(q)===0;});
      if(s) starts.push(d); else if(cfg.hay(d).indexOf(q)>-1) contains.push(d);
    }
    var k=function(d){return cfg.rank(d)*1e6 + prom(cfg.sub(d));};
    starts.sort(function(a,b){return k(a)-k(b);}); contains.sort(function(a,b){return k(a)-k(b);});
    return starts.concat(contains).slice(0,8);
  }
  function render(){
    fitBox();
    if(!matches.length){ box.innerHTML='<div class="ac-empty">'+T.noMatch+'</div>'; box.classList.add('open'); return; }
    box.innerHTML=matches.map(function(d,i){
      return '<div class="ac-item'+(i===activeIdx?' active':'')+'" data-i="'+i+'"><span class="ac-pin">●</span>'
        +'<span><span class="ac-main">'+cfg.main(d)+'</span><br><span class="ac-sub">'+cfg.sub(d)+'</span></span></div>';
    }).join(''); box.classList.add('open');
  }
  var seq=0;
  function bundled(q, mySeq){
    if(!DATA[key]){ box.innerHTML='<div class="ac-loading"><span class="ac-spin"></span>'+T.loading+'</div>'; fitBox(); box.classList.add('open'); }
    loadData(key).then(function(){ if(mySeq===seq){ matches=search(q); render(); } });
  }
  input.addEventListener('input', function(){
    input._sel=null; activeIdx=-1;
    var q=input.value.trim();
    if(q.length<2){ box.classList.remove('open'); return; }
    var mySeq=++seq;
    if(!QB.api){ bundled(q, mySeq); return; }
    // live mode: debounce, then proxy; bundled datasets are the fallback if the proxy is down
    box.innerHTML='<div class="ac-loading"><span class="ac-spin"></span>'+T.loading+'</div>'; fitBox(); box.classList.add('open');
    clearTimeout(input._deb);
    input._deb=setTimeout(function(){
      liveSearch(key, q).then(function(list){
        if(mySeq!==seq) return;
        if(list){ matches=list.slice(0,8); render(); }
        else bundled(q, mySeq);
      });
    }, 250);
  });
  box.addEventListener('mousedown', function(e){ var it=e.target.closest('.ac-item'); if(!it) return;
    var d=matches[+it.getAttribute('data-i')]; input._sel=d; input.value=cfg.pick(d); box.classList.remove('open');
  });
  input.addEventListener('keydown', function(e){
    if(!box.classList.contains('open')||!matches.length) return;
    if(e.key==='ArrowDown'){activeIdx=Math.min(activeIdx+1,matches.length-1);render();e.preventDefault();}
    else if(e.key==='ArrowUp'){activeIdx=Math.max(activeIdx-1,0);render();e.preventDefault();}
    else if(e.key==='Enter'&&activeIdx>-1){var d=matches[activeIdx];input._sel=d;input.value=cfg.pick(d);box.classList.remove('open');e.preventDefault();}
    else if(e.key==='Escape'){box.classList.remove('open');}
  });
  document.addEventListener('click', function(e){ if(!box.parentNode.contains(e.target)) box.classList.remove('open'); });
}

/* ============ date-pair guards: end can never precede start; no past dates ============ */
function guardDates(a, b, minGap){  // minGap in days: 1 = at least one night, 0 = same-day ok
  function fix(){
    var today=isoDate(0);
    if(a.value && a.value<today) a.value=today;
    if(!a.value) return;
    var min=isoDateFrom(a.value, minGap);
    b.min=min;
    if(b.value<min) b.value=min;
  }
  a.min=isoDate(0);
  a.addEventListener('change', fix); b.addEventListener('change', fix);
  fix();
}
function guardTimes(a, b){  // datetime-local pair (cars): drop-off snaps to pickup +1 day when invalid
  function fix(){
    if(!a.value) return;
    b.min=a.value;
    if(b.value<=a.value){ var p=a.value.split('T'); b.value=isoDateFrom(p[0],1)+'T'+(p[1]||'10:00'); }
  }
  a.min=isoDate(0)+'T00:00';
  a.addEventListener('change', fix); b.addEventListener('change', fix);
  fix();
}

function plural(n, one, many){ return n+' '+(n===1?one:many); }
// same viewport-fit rules as the autocomplete dropdown: cap height to the room inside the iframe, flip up when there's more space above
function fitPop(fld, pop){
  var r=fld.getBoundingClientRect();
  var below=window.innerHeight-r.bottom-12, above=r.top-12;
  if(below<180 && above>below){ pop.classList.add('up'); pop.style.maxHeight=Math.max(120,Math.min(360, above-4))+'px'; }
  else { pop.classList.remove('up'); pop.style.maxHeight=Math.max(120,Math.min(360, below-8))+'px'; }
  pop.style.left='0px';
  var pr=pop.getBoundingClientRect();
  if(pr.right>window.innerWidth-8) pop.style.left=Math.min(0,(window.innerWidth-8-pr.width)-r.left)+'px';
}
function popShell(fld, input, render){
  var pop=el('<div class="pop"></div>'); fld.appendChild(pop);
  input.readOnly=true;
  input.addEventListener('click', function(){
    pop.classList.toggle('open');
    if(pop.classList.contains('open')){ render(); fitPop(fld, pop); }
  });
  document.addEventListener('click', function(e){ if(!fld.contains(e.target)) pop.classList.remove('open'); });
  return pop;
}
/* hotels: per-room adults/children + child ages */
function wireRoomsPop(fld, input){
  var rooms=[{adults:2, childs:0, ages:[]}];
  function summary(){
    var g=0; rooms.forEach(function(r){ g+=r.adults+r.childs; });
    input.value=plural(rooms.length,T.room,T.rooms)+', '+plural(g,T.guest,T.guestsW);
  }
  function render(){
    var h='';
    rooms.forEach(function(r,i){
      h+='<div class="pop-room"><div class="pop-head"><span>'+T.room+' '+(i+1)+'</span>'
        +(rooms.length>1?'<button type="button" class="pop-x" data-del="'+i+'">'+T.remove+'</button>':'')+'</div>'
        +'<div class="pop-row"><span>'+T.adults+'</span><span class="step"><button type="button" data-k="a-" data-i="'+i+'" '+(r.adults<=1?'disabled':'')+'>−</button><span>'+r.adults+'</span><button type="button" data-k="a+" data-i="'+i+'" '+(r.adults>=8?'disabled':'')+'>+</button></span></div>'
        +'<div class="pop-row"><span>'+T.childrenW+'</span><span class="step"><button type="button" data-k="c-" data-i="'+i+'" '+(r.childs<=0?'disabled':'')+'>−</button><span>'+r.childs+'</span><button type="button" data-k="c+" data-i="'+i+'" '+(r.childs>=6?'disabled':'')+'>+</button></span></div>';
      r.ages.forEach(function(a,j){
        h+='<div class="age-row"><span>'+T.childAge.replace('{n}',j+1)+'</span><input type="number" min="1" max="17" value="'+a+'" data-age="'+i+':'+j+'"></div>';
      });
      h+='</div>';
    });
    h+='<div class="pop-foot"><button type="button" class="pop-add">+ '+T.addRoom+'</button><button type="button" class="pop-done">'+T.done+'</button></div>';
    pop.innerHTML=h; summary();
  }
  var pop=popShell(fld, input, render);
  pop.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.classList.contains('pop-done')){ pop.classList.remove('open'); return; }
    if(b.classList.contains('pop-add')){ if(rooms.length<4){ rooms.push({adults:2,childs:0,ages:[]}); render(); fitPop(fld,pop); } return; }
    if(b.dataset.del!==undefined){ rooms.splice(+b.dataset.del,1); render(); fitPop(fld,pop); return; }
    var i=+b.dataset.i, r=rooms[i], k=b.dataset.k; if(!r) return;
    if(k==='a+'&&r.adults<8)r.adults++; else if(k==='a-'&&r.adults>1)r.adults--;
    else if(k==='c+'&&r.childs<6){ r.childs++; r.ages.push(8); }
    else if(k==='c-'&&r.childs>0){ r.childs--; r.ages.pop(); }
    render(); fitPop(fld,pop);
  });
  pop.addEventListener('input', function(e){
    var t=e.target; if(!t.dataset.age) return;
    var q=t.dataset.age.split(':'); rooms[+q[0]].ages[+q[1]]=parseInt(t.value)||8;
  });
  summary();
  return function(){ return rooms; };
}

      h+='<div class="pop-opt" data-v="'+c[0]+'"><input type="checkbox" '+(sel.indexOf(c[0])>-1?'checked':'')+'> <span>'+c[ACT_LI]+'</span></div>';
    });
    h+='<div class="pop-foot"><span></span><button type="button" class="pop-done">'+T.done+'</button></div>';
    pop.innerHTML=h; summary();
  }
  var pop=popShell(fld, input, render);
  pop.addEventListener('click', function(e){
    var d=e.target.closest('.pop-done'); if(d){ pop.classList.remove('open'); return; }
    var o=e.target.closest('.pop-opt'); if(!o) return;
    var v=o.getAttribute('data-v');
    if(!v){ sel=[]; }                                    // "All" clears the selection
    else { var i=sel.indexOf(v); if(i>-1) sel.splice(i,1); else sel.push(v); }
    render(); fitPop(fld,pop);
  });
  summary();
  return function(){ return sel.slice(); };
}

/* flights: adults / children / infants steppers */
function wireTravPop(fld, input){
  var tr={adults:1, children:0, infants:0};
  function summary(){
    var s=plural(tr.adults,T.adult1,T.adults);
    if(tr.children) s+=', '+plural(tr.children,T.child1,T.childrenW);
    if(tr.infants) s+=', '+plural(tr.infants,T.infant1,T.infants);
    input.value=s;
  }
  function row(key,label,hint,val,min,max){
    return '<div class="pop-row"><span>'+label+'<span class="hint">'+hint+'</span></span><span class="step">'
      +'<button type="button" data-k="'+key+'-" '+(val<=min?'disabled':'')+'>−</button><span>'+val+'</span>'
      +'<button type="button" data-k="'+key+'+" '+(val>=max?'disabled':'')+'>+</button></span></div>';
  }
  function render(){
    pop.innerHTML=row('a',T.adults,T.adultHint,tr.adults,1,9)
      +row('c',T.childrenW,T.childHint,tr.children,0,8)
      +row('i',T.infants,T.infantHint,tr.infants,0,tr.adults)
      +'<div class="pop-foot"><span></span><button type="button" class="pop-done">'+T.done+'</button></div>';
    summary();
  }
  var pop=popShell(fld, input, render);
  pop.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.classList.contains('pop-done')){ pop.classList.remove('open'); return; }
    var k=b.dataset.k;
    if(k==='a+'&&tr.adults<9)tr.adults++; else if(k==='a-'&&tr.adults>1)tr.adults--;
    else if(k==='c+'&&tr.children<8)tr.children++; else if(k==='c-'&&tr.children>0)tr.children--;
    else if(k==='i+'&&tr.infants<tr.adults)tr.infants++; else if(k==='i-'&&tr.infants>0)tr.infants--;
    if(tr.infants>tr.adults)tr.infants=tr.adults;
    render(); fitPop(fld,pop);
  });
  summary();
  return function(){ return tr; };
}

/* ================= URL builders (shapes captured live from the OTA, 2026-07-29 — see docs/superpowers/specs/2026-07-29-search-params-design.md) ================= */
function hotelsUrl(f){
  var loc=f.dest._sel || {id:"0",name:f.dest.value,full_name:f.dest.value,country:"",type:"City",lat:0,long:0};
  var parts=(loc.full_name||'').split(',').map(function(s){return s.trim();});
  var state=loc.state||(parts.length>=3?parts[parts.length-2]:"");
  var cin=f.cin.value||isoDate(14), cout=f.cout.value||isoDate(17);
  var p=new URLSearchParams();
  p.append('correlationId',uuid());
  p.append('startDate',cin);
  p.append('endDate',cout);
  p.append('forceGet','true');
  p.append('isOTA','true');
  p.append('location',JSON.stringify({id:String(loc.id||"0"),country:loc.country||"",full_name:loc.full_name||loc.name,location:{lat:loc.lat||0,long:loc.long||0},name:loc.name,state:state,type:loc.type||"City"}));
  var rooms=f.rooms();
  p.append('occupancy',JSON.stringify(rooms.map(function(r){
    return {id:uuid(),numOfRoom:rooms.length,adults:r.adults,childs:r.childs,childages:r.ages.map(function(a){return Math.max(1,Math.min(17,parseInt(a)||8));})};
  })));
  p.append('paging',JSON.stringify({pageNo:1,pageSize:50}));
  p.append('preference',JSON.stringify([]));
  p.append('stayPeriod',JSON.stringify({start:cin,end:cout}));
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/hotels/v2/search?'+p.toString();
}
function airportObj(sel, raw){
  if(sel) return {airport_code:sel.code,airport_name:sel.name,city_code:sel.city_code||'',city_name:sel.city,country_code:sel.cc||'',country_name:sel.country||''};
  return {airport_code:'',airport_name:raw||'',city_code:'',city_name:raw||'',country_code:'',country_name:''};
}
function flightsUrl(f){
  var dep=f.dep.value||isoDate(14);
  var round=f.body.querySelector('input[name=trip]:checked').value==='round';
  var tr=f.trav();
  var q={
    selectedOrigin:airportObj(f.from._sel,f.from.value),
    selectedDestination:airportObj(f.to._sel,f.to.value),
    rangeDate:{startDate:dep,endDate:(round?(f.ret.value||dep):dep)},
    route_type:round?'roundTrip':'oneWay',
    cabin_type:f.cabin.value, adults:tr.adults, children:tr.children, infants:tr.infants
  };
  if(f.nonstop.checked) q.max_stops_quantity='Direct';
  var p=new URLSearchParams(); p.append('query',JSON.stringify(q));
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/flights/v2/search?'+p.toString();
}
function resortsUrl(f){
  var s=f.dest._sel || {name:f.dest.value,full_name:f.dest.value,city:"",country:"",region:"",type:"city",lat:0,lon:0};
  var cin=f.cin.value||isoDate(14), cout=f.cout.value||isoDate(17);
  // serialize the picked suggestion verbatim, as the OTA does — resort entries carry extra
  // fields (state, popularity, type:"resort") that must ride along; lat/lon nest into location
  var loc={}; for(var k in s){ if(s.hasOwnProperty(k) && k!=='lat' && k!=='lon') loc[k]=s[k]; }
  loc.location={lat:s.lat||0,lon:s.lon||0};
  var p=new URLSearchParams(); p.append('correlationId',uuid());
  p.append('endDate',new Date(cout+'T00:00:00').toString());
  p.append('location',JSON.stringify(loc));
  p.append('startDate',new Date(cin+'T00:00:00').toString());
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/resort/search?'+p.toString();
}
function twelveHr(t){ if(!t) return '10:00 AM'; var a=t.split(':'),h=parseInt(a[0],10),m=a[1],ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }
function carLoc(s){
  return {id:s.id||"",name:s.name,city_name:s.city_name||"",country_name:s.country_name||"",iata_code:s.iata_code||"",type:s.type||"location",coordinates:s.coordinates||{},region_id:s.region_id||"",state:s.state||""};
}
function carsUrl(f){
  var s=f.pick._sel || {id:"",name:f.pick.value,city_name:"",country_name:"",iata_code:"",type:"location",coordinates:{},region_id:"",state:""};
  // drop-off: empty field = same as pickup; typed/picked = different location (OTA capture 2026-07-29)
  var dSel=f.dropLoc._sel, dRaw=f.dropLoc.value.trim();
  var d=dSel || (dRaw?{id:"",name:dRaw,city_name:"",country_name:"",iata_code:"",type:"location",coordinates:{},region_id:"",state:""}:null);
  var coords=s.coordinates||{};
  var pu=f.pickup.value.split('T'), dp=f.drop.value.split('T');
  var age=Math.max(18,Math.min(99,parseInt(f.age.value)||25));
  var ret=d||s;  // return/dropoff side of the trip
  var p=new URLSearchParams();
  p.append('code','US');  // stays US even for non-US nationality — matches the OTA (nationality goes in 'country')
  p.append('correlationId',uuid());
  p.append('country',f.nat.value||'US'); p.append('currency','USD'); p.append('driverAge',String(age));
  p.append('dropOffLocation',d?d.name:'');
  p.append('dropOffLocationData',d?JSON.stringify(carLoc(d)):'');
  p.append('dropOffOption',d?'Drop-off at different location':'Same as pick-up');
  p.append('dropoffTime',twelveHr(dp[1])); p.append('dropoff_location',ret.name);
  p.append('endDate',dp[0]||'');
  p.append('location',JSON.stringify(carLoc(s)));
  p.append('pickupCode',s.iata_code||""); p.append('pickupTime',twelveHr(pu[1]));
  p.append('pickupType',s.type==='airport'?'iata':'geo');
  p.append('pickup_geo',(coords.lat!=null?coords.lat+','+coords.lon:''));
  p.append('pickup_location',s.name);
  p.append('returnCode',ret.iata_code||""); p.append('returnType',ret.type==='airport'?'iata':'geo');
  p.append('startDate',pu[0]||'');
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/cars/v2/search?'+p.toString();
}
function activitiesUrl(f){
  var sel=f.dest._sel;
  if(sel && sel.p){  // individual tour/transfer picked → product detail deep link (OTA shape captured 2026-07-29)
    var q=new URLSearchParams(); q.append('productId',sel.id); q.append('correlationId',uuid());
    return QB.platformUrl.replace(/\/+$/,'')+'/booknow/activity/v2/details?'+q.toString();
  }
  var s=sel || {name:f.dest.value,id:"",lat:0,long:0};
  var start=f.date.value, end=start?isoDateFrom(start,1):'';
  var p=new URLSearchParams();
  var cats=f.cats?f.cats():[];
  if(cats.length) p.append('categories',JSON.stringify(cats));  // OTA results page preselects+filters from this (verified 2026-07-29; multi verified 2026-07-30)
  p.append('correlationId',uuid());
  if(start) p.append('startDate',start); if(end) p.append('endDate',end);
  p.append('isOTA','true');
  p.append('location',JSON.stringify({name:s.name,id:s.id||"",location:{lat:s.lat||0,long:s.long||0}}));
  p.append('occupancy',JSON.stringify([{adults:parseInt(f.guests.value)||2,childs:0,childages:[]}]));
  p.append('preference',JSON.stringify([]));
  return QB.platformUrl.replace(/\/+$/,'')+'/booknow/activity/v2/search?'+p.toString();
}
function isoDateFrom(d, addDays){ var t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+addDays); return fmtDate(t); }

var qbTabs=document.getElementById('qb-tabs'), qbBody=document.getElementById('qb-body');
function selectTab(key){

}
